{% extends "base.html" %}
{% block title %}Crear Usuario{% endblock %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-md-7 col-lg-6">
    <div class="card shadow-sm border-0">
      <div class="card-body p-4">
        <div class="text-center mb-4">
          <i class="bi bi-person-plus text-success" style="font-size:2.5rem;"></i>
          <h1 class="h4 fw-bold mt-2 mb-1">Crear Usuario</h1>
          <p class="text-muted small mb-0">Registra un nuevo usuario para el sistema.</p>
        </div>

        <form method="POST" action="{{ url_for('register') }}">
          <div class="mb-3">
            <label class="form-label fw-semibold">Usuario</label>
            <input type="text" name="username" class="form-control" minlength="3" required />
          </div>
          <div class="mb-3">
            <label class="form-label fw-semibold">Contraseña</label>
            <input type="password" name="password" class="form-control" minlength="6" required />
          </div>
          <div class="mb-3">
            <label class="form-label fw-semibold">Confirmar contraseña</label>
            <input type="password" name="confirm_password" class="form-control" minlength="6" required />
          </div>
          <div class="d-grid gap-2">
            <button type="submit" class="btn btn-success">
              <i class="bi bi-check2-circle me-1"></i>Crear usuario
            </button>
            <a href="{{ url_for('login') }}" class="btn btn-outline-secondary">Volver al login</a>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
