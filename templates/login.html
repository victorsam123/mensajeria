{% extends "base.html" %}
{% block title %}Iniciar Sesión{% endblock %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-md-6 col-lg-5">
    <div class="card shadow-sm border-0">
      <div class="card-body p-4">
        <div class="text-center mb-4">
          <i class="bi bi-shield-lock text-primary" style="font-size:2.5rem;"></i>
          <h1 class="h4 fw-bold mt-2 mb-1">Iniciar Sesión</h1>
          <p class="text-muted small mb-0">Accede para gestionar la mensajería masiva.</p>
        </div>

        <form method="POST" action="{{ url_for('login') }}">
          <input type="hidden" name="next" value="{{ next_url }}" />
          <div class="mb-3">
            <label class="form-label fw-semibold">Usuario</label>
            <input type="text" name="username" class="form-control" required autofocus />
          </div>
          <div class="mb-3">
            <label class="form-label fw-semibold">Contraseña</label>
            <input type="password" name="password" class="form-control" required />
          </div>
          <div class="d-grid">
            <button type="submit" class="btn btn-primary">
              <i class="bi bi-box-arrow-in-right me-1"></i>Ingresar
            </button>
          </div>
        </form>

        {% if not has_users %}
        <div class="alert alert-info mt-3 mb-0 small">
          Aún no existen usuarios. Crea el primero aquí:
          <a href="{{ url_for('register') }}" class="alert-link">Crear usuario inicial</a>.
        </div>
        {% endif %}
      </div>
    </div>
  </div>
</div>
{% endblock %}
